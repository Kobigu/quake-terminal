# Quake terminal — global F12 hotkey (keyd)
#
# Install: sudo cp keyd.conf /etc/keyd/default.conf && sudo keyd.rvaiya reload
# (binary is keyd.rvaiya in the Debian package; the service is keyd.service)
#
# Binds F12 at the evdev level and runs the toggle wrapper as the user.
# keyd consumes the key before the compositor sees it, so there is no
# double-fire with the compositor-side shortcut (the wrapper is debounced
# anyway). If keyd is ever disabled, the compositor shortcut (see
# cosmic-shortcuts.ron) takes over after the next login.

[ids]
*

[main]
f12 = command(/usr/sbin/runuser -u toby -- /home/toby/.local/bin/quake-terminal)
