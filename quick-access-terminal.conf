# quake-terminal config — read by our custom kitty fork's
# `kitten quick-access-terminal` (kitty 0.49.1 quake fork)
#
# Geometry is resolved by the fork itself: `lines 50%` = half the monitor
# height (this is a fork feature, upstream kitty only understands lines/px).

# ─── Placement ───
edge top
# half the screen height, full width
lines 50%
# above everything (including the COSMIC top panel); use `top` to stay below it
layer overlay

# ─── Animation ───
# slide down from the top edge over 150ms (fork feature; 0 disables)
slide_duration 150

# ─── Behavior ───
# keep the keyboard while the terminal is open (quake-style modal).
# If you want DD-Term-like "hide when clicking elsewhere", set:
#   focus_policy on-demand
#   hide_on_focus_loss yes
focus_policy exclusive
hide_on_focus_loss no

# instance identity (layer-surface namespace on Wayland)
app_id quake-kitty

# ─── Looks ───
background_opacity 0.86

# ─── Remote control ───
# give the instance a stable socket so `kitten @ --to unix:@quake-kitty`
# works (for scripting; only reachable by processes of the same user)
listen_on unix:@quake-kitty
kitty_override allow_remote_control=socket-only
# never fall back to X11 (the quake behavior needs the wayland layer-shell)
kitty_override linux_display_server=wayland
